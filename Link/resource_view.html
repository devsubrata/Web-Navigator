<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Resource & Note Viewer</title>
        <style>
            body {
                margin: 0;
            }
            .image-viewer {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .img-navigation {
                display: inline-flex;
                margin: auto;
                align-items: center;
                gap: 10px;
                position: fixed;
                top: 0;
                background: #015a29b7;
                padding: 5px;
                border-radius: 5px;
            }
            .img-navigation button,
            #imgFolder,
            #loadedImgList {
                padding: 5px 10px;
                cursor: pointer;
                outline: none;
                border: none;
                border-radius: 5px;
            }
            .home-link {
                background: #fff;
                padding: 3px 6px;
                cursor: pointer;
                border-radius: 5px;
            }
            .img-navigation .img-nav button {
                padding: 2px;
                font-size: 18px;
            }

            #imgCount {
                display: inline-block;
                padding: 4px 10px;
                border-radius: 5px;
                background: white;
            }

            .img-navigation button:hover {
                background: #ddd;
            }
            .img-wrapper {
                border: 2px solid rgba(28, 116, 248, 0.8);
                border-radius: 10px;
                margin: 41px 5px;
                transform-origin: top left;
            }

            .img-wrapper img {
                width: 100%;
                object-fit: cover;
                transition: transform 0.3s ease;
                transform-origin: top left;
                border-radius: 10px;
            }
        </style>
    </head>

    <body>
        <div class="image-viewer">
            <div class="img-navigation">
                <div>
                    <button id="downloadImage" title="Download loaded script">🡻</button>
                </div>
                <div>
                    <button id="prevImage">◀</button>
                    <span id="imgCount"></span>
                    <button id="nextImage">▶</button>
                </div>
                <div>
                    <select name="imgCategory" id="imgFolder"></select>
                    <select name="imageList" id="loadedImgList"></select>
                </div>
                <div>
                    <button id="zoomIn">➕</button>
                    <button id="zoomOut">➖</button>
                </div>
                <div class="img-nav">
                    <button id="up">⏫</button>
                    <button id="down">⏬</button>
                </div>
                <a href="../index.html" class="home-link">⾕</a>
            </div>
            <div class="img-wrapper">
                <img src="./resource/ReadingArticle/IELTS Reading Topics.png" />
            </div>
        </div>
        <script src="./resource/helpfulFn.js"></script>
        <script src="./resource/imgList.js"></script>
        <script>
            let currentImgIndex = 0;

            const imgDirSelect = document.getElementById("imgFolder");
            const loadedImgList = document.getElementById("loadedImgList");
            const img = document.querySelector(".img-wrapper img");
            const imgCount = document.getElementById("imgCount");
            const imgViewer = document.querySelector(".image-viewer");
            const imgWrapper = document.querySelector(".img-wrapper");

            categoryList.forEach((t, i) => {
                const option = document.createElement("option");
                option.value = t;
                option.textContent = t;
                if (i === 0) option.setAttribute("selected", true);
                imgDirSelect.appendChild(option);
            });

            imgDirSelect.addEventListener("change", setImageDirectory);
            loadedImgList.addEventListener("change", () => {
                let dirName = imgDirSelect.value;
                const selectedName = loadedImgList.value; // no extension

                let imgList = loadedImageList(dirName);
                let matched = imgList.find((image) => image === selectedName);

                if (matched) {
                    img.src = `./resource/${dirName}/${matched}`;
                    currentImgIndex = imgList.findIndex((image) => image === matched);
                    imgCount.textContent = `${currentImgIndex + 1} / ${imgList.length}`;
                }
            });

            function setImageDirectory() {
                let dirName = imgDirSelect.value;
                let imgList = loadedImageList(dirName);

                loadedImgList.innerHTML = "";
                imgList.forEach((t, i) => {
                    const option = document.createElement("option");
                    option.value = t;
                    option.textContent = getImageName(t);
                    if (i === 0) option.setAttribute("selected", true);
                    loadedImgList.appendChild(option);
                });

                img.src = `./resource/${dirName}/${imgList[0]}`;
                currentImgIndex = 0;
                imgCount.textContent = `${currentImgIndex + 1} / ${imgList.length}`;

                document.getElementById("prevImage").onclick = () => {
                    if (currentImgIndex === 0) return;
                    img.src = `./resource/${dirName}/${imgList[--currentImgIndex]}`;
                    imgCount.textContent = `${currentImgIndex + 1} / ${imgList.length}`;
                    loadedImgList.value = imgList[currentImgIndex];
                };

                document.getElementById("nextImage").onclick = () => {
                    if (currentImgIndex === imgList.length - 1) return;
                    img.src = `./resource/${dirName}/${imgList[++currentImgIndex]}`;
                    imgCount.textContent = `${currentImgIndex + 1} / ${imgList.length}`;
                    loadedImgList.value = imgList[currentImgIndex];
                };

                let scale = 1;
                const wrapper = document.querySelector(".img-wrapper");
                const baseWidth = wrapper.offsetWidth;

                document.getElementById("zoomIn").onclick = () => {
                    scale += 0.05;
                    wrapper.style.width = `${baseWidth * scale}px`;
                };

                document.getElementById("zoomOut").onclick = () => {
                    scale -= 0.05;
                    if (scale < 0.3) scale = 0.3;
                    wrapper.style.width = `${baseWidth * scale}px`;
                };
            }
            setImageDirectory();

            // 2. Scroll to the top of the container
            document.getElementById("up").onclick = () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth",
                });
            };

            // 3. Scroll to the bottom of the container
            document.getElementById("down").onclick = () => {
                window.scrollTo({
                    top: document.documentElement.scrollHeight,
                    behavior: "smooth",
                });
            };

            document.getElementById("downloadImage").onclick = () => downloadImage(img);
        </script>
    </body>
</html>
